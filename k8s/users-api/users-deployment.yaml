apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-deployment
  namespace: apps
  labels:
    app: users-api
  annotations:
    description: "Deployment para a API de Usuários, garantindo alta disponibilidade e escalabilidade para o serviço de gerenciamento de usuários."

spec:
  replicas: 1
  
  selector:
    matchLabels:
      app: users-api
  
  template:
    metadata:
      labels:
        app: users-api
    
    spec:
      containers:
        - name: users
          image: projetofiap/fiap-esperanca-solidaria-usuario-api:latest
          
          ports:
            - containerPort: 8080
          
          resources:
            requests: # recursos mínimos
              memory: "128Mi"
              cpu: "250m"
            
            limits: # recursos máximos
              memory: "256Mi"
              cpu: "500m"

          env:
            # SQS
            - name: SqsSettings__Region
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: SQS_REGION

            - name: SqsSettings__AccessKey
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: SQS_ACCESS_KEY

            - name: SqsSettings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: SQS_SECRET_KEY

            - name: SqsSettings__ServiceURL
              valueFrom:
                configMapKeyRef:
                  name: shared-config
                  key: SQS_SERVICE_URL

            - name: SqsSettings__EmailQueueURL
              valueFrom:
                configMapKeyRef:
                  name: shared-config
                  key: SQS_EMAIL_QUEUE_URL

            # S3 (foto de perfil) — mesmo LocalStack e credenciais fake do SQS.
            # ServiceUrl e o endereco dentro do cluster; PublicBaseUrl e o que o navegador
            # resolve (NodePort do LocalStack) e vira o prefixo da URL devolvida no upload.
            - name: S3Settings__Region
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: SQS_REGION

            - name: S3Settings__AccessKey
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: SQS_ACCESS_KEY

            - name: S3Settings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: SQS_SECRET_KEY

            - name: S3Settings__ServiceUrl
              valueFrom:
                configMapKeyRef:
                  name: shared-config
                  key: SQS_SERVICE_URL

            - name: S3Settings__PublicBaseUrl
              value: "http://localhost:30466"

            # Db
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: DB_USER_CONNECTION_STRING

            # Redis
            - name: ConnectionStrings__Redis
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: REDIS_CONNECTION_STRING

            # Firebase
            - name: Firebase__CredentialJson
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: FIREBASE_CREDENTIALJSON
                  
            - name: Firebase__ApiKey
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: FIREBASE_APIKEY

            - name: Firebase__ProjectId
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: FIREBASE_PROJECT_ID

            # Observabilidade
            - name: OpenTelemetry__ServiceName
              value: "usuario-api"
            - name: OpenTelemetry__TempoEndpoint
              value: "http://tempo.monitoring.svc.cluster.local:4318/v1/traces"