apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv-campanha
  labels:
    app: postgresdb-campanha
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath
  hostPath:
    path: /tmp/postgres-campanha-data
  claimRef:
    namespace: database
    name: postgres-pvc-campanha
