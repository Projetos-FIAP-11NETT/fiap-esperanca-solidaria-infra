apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: elasticsearch-pvc
  namespace: database

  labels:
    app: elasticsearch

  annotations:
    description: "PersistentVolumeClaim para o Elasticsearch, garantindo persistência do índice de busca mesmo que o pod seja reiniciado ou recriado."

spec:
  accessModes:
    - ReadWriteOnce
    
  storageClassName: hostpath

  resources:
    requests:
      storage: 10Gi
