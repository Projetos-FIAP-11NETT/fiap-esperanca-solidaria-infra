apiVersion: apps/v1
kind: Deployment

metadata:
  name: campaigns-deployment

  labels:
    app: campaigns-api

  annotations:
    description: "Deployment para a API de Campanhas, garantindo alta disponibilidade e escalabilidade para o serviço de processamento de campanhas."

spec:
  replicas: 1

  selector:
    matchLabels:
      app: campaigns-api

  template:
    metadata:
      labels:
        app: campaigns-api

    spec:
      containers:
        - name: campaigns
          image: projetofiap/campaigns-api:latest

          ports:
            - containerPort: 8080

          resources:
            requests: #minimum resources guaranteed to the container
              memory: "128Mi"
              cpu: "250m"

            limits: #maximum resources that the container can use
              memory: "256Mi"
              cpu: "500m"

          env:
            # SQS
            - name: SqsSettings__Region
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: SQS_REGION

            - name: SqsSettings__AccessKey
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: SQS_ACCESS_KEY

            - name: SqsSettings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: SQS_SECRET_KEY

            - name: SqsSettings__ServiceURL
              valueFrom:
                configMapKeyRef:
                  name: shared-config
                  key: SQS_SERVICE_URL

            - name: SqsSettings__EmailQueueURL
              valueFrom:
                configMapKeyRef:
                  name: shared-config
                  key: SQS_DONATION_QUEUE_URL
            
            # Db
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: DB_USER_CONNECTION_STRING
            
            # Redis
            - name: ConnectionStrings_Redis
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: REDIS_CONNECTION_STRING