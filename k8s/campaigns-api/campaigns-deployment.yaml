apiVersion: apps/v1
kind: Deployment

metadata:
  name: campaigns-deployment
  namespace: apps

  labels:
    app: campaigns-api

  annotations:
    description: "Deployment para a API de Campanhas, garantindo alta disponibilidade e escalabilidade para o serviço de processamento de campanhas."

spec:
  replicas: 1

  selector:
    matchLabels:
      app: campaigns-api

  template:
    metadata:
      labels:
        app: campaigns-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"

    spec:
      containers:
        - name: campaigns
          image: projetofiap/fiap-esperanca-solidaria-campanha-api:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          resources:
            requests: #minimum resources guaranteed to the container
              memory: "128Mi"
              cpu: "250m"

            limits: #maximum resources that the container can use
              memory: "256Mi"
              cpu: "500m"

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Kubernetes"

            # SQS
            - name: SqsSettings__Region
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: SQS_REGION

            - name: SqsSettings__AccessKey
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: SQS_ACCESS_KEY

            - name: SqsSettings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: SQS_SECRET_KEY

            - name: SqsSettings__ServiceURL
              valueFrom:
                configMapKeyRef:
                  name: shared-config
                  key: SQS_SERVICE_URL

            - name: SqsSettings__EmailQueueURL
              valueFrom:
                configMapKeyRef:
                  name: shared-config
                  key: SQS_DONATION_QUEUE_URL

            # S3 (imagem de capa da campanha) — mesmo LocalStack e credenciais fake do SQS.
            # ServiceUrl e o endereco dentro do cluster; PublicBaseUrl e o que o navegador
            # resolve (NodePort do LocalStack) e vira o prefixo da URL devolvida no upload.
            - name: S3Settings__Region
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: SQS_REGION

            - name: S3Settings__AccessKey
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: SQS_ACCESS_KEY

            - name: S3Settings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: SQS_SECRET_KEY

            - name: S3Settings__ServiceUrl
              valueFrom:
                configMapKeyRef:
                  name: shared-config
                  key: SQS_SERVICE_URL

            - name: S3Settings__PublicBaseUrl
              value: "http://localhost:30466"

            # Db
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: DB_CAMPAIGN_CONNECTION_STRING

            # Redis
            - name: ConnectionStrings__Redis
              valueFrom:
                secretKeyRef:
                  name: shared-secret
                  key: REDIS_CONNECTION_STRING

            # Observabilidade
            - name: OpenTelemetry__ServiceName
              value: "campanha-api"
            - name: OpenTelemetry__TempoEndpoint
              value: "http://tempo.monitoring.svc.cluster.local:4318/v1/traces"

            # Cors
            - name: Cors__AllowedOrigins__0
              valueFrom:
                configMapKeyRef:
                  name: shared-config
                  key: CORS_ALLOWED_ORIGINS