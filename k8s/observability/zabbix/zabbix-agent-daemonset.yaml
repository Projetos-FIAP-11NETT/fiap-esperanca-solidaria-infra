apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: zabbix-agent
  namespace: monitoring
  labels:
    app: zabbix-agent
spec:
  selector:
    matchLabels:
      app: zabbix-agent
  template:
    metadata:
      labels:
        app: zabbix-agent
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: zabbix-agent
        image: zabbix/zabbix-agent:alpine-6.4-latest
        ports:
        - containerPort: 10050
          name: zabbix-agent
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: ZBX_HOSTNAME
          value: "$(NODE_NAME)"
        - name: ZBX_HOSTNAMEITEM
          value: "system.hostname"
        - name: ZBX_SERVER_HOST
          value: zabbix-server
        - name: ZBX_SERVER_PORT
          value: "10051"
        - name: ZBX_PASSIVESERVERS
          value: "0.0.0.0/0"
        - name: ZBX_STARTAGENTS
          value: "3"
        - name: ZBX_TIMEOUT
          value: "30"
        - name: ZBX_SERVER_ACTIVE
          value: zabbix-server:10051
        - name: ZBX_METADATA
          value: "kubernetes"
        securityContext:
          privileged: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
