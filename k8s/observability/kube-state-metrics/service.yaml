# kube-state-metrics v2.20.0 — manifest oficial, sem alteracoes:
# https://github.com/kubernetes/kube-state-metrics/blob/v2.20.0/examples/standard/service.yaml.yaml
# Coletado pelo job "kube-state-metrics" em k8s/observability/prometheus/prometheus-config.yaml.
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: exporter
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/version: 2.20.0
  name: kube-state-metrics
  namespace: kube-system
spec:
  clusterIP: None
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
    - name: telemetry
      port: 8081
      targetPort: telemetry
  selector:
    app.kubernetes.io/name: kube-state-metrics
