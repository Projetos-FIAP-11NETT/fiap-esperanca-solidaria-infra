apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  namespace: monitoring

  annotations:
    description: "prometheus.yml montado em /etc/prometheus pelo prometheus-deployment. Arquivo nao termina em configmap.yaml de proposito: esse padrao esta no .gitignore."

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # Pods que se anunciam com as anotacoes prometheus.io/scrape|port|path
      # (usa o ServiceAccount/ClusterRole "prometheus" do prometheus-deployment).
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

      # Estado dos objetos do cluster (deployments, pods, nodes...). Instalado no
      # kube-system a partir dos manifests oficiais (examples/standard, v2.20.0).
      # honor_labels mantem namespace/pod dos objetos descritos, e nao os do exporter.
      - job_name: kube-state-metrics
        honor_labels: true
        static_configs:
          - targets: ["kube-state-metrics.kube-system.svc.cluster.local:8080"]

      # cAdvisor do kubelet: uso real de CPU/memoria por container/pod
      # (container_cpu_usage_seconds_total, container_memory_working_set_bytes...).
      # Direto no kubelet (:10250) porque o proxy do API server para o node responde
      # 404 no Docker Desktop. Requer nodes/metrics no ClusterRole "prometheus".
      - job_name: kubelet-cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node

      # users-api e donation-worker expoem /metrics mas os deployments nao tem as
      # anotacoes acima; entram pelo Service.
      - job_name: apps
        metrics_path: /metrics
        static_configs:
          - targets:
              - users-api.apps.svc.cluster.local:80
              - donation-worker.apps.svc.cluster.local:80
